name: Training

# Von Hand ausgeloest, nie automatisch.  Ein Lauf kostet Rechenzeit, und die
# Reihenfolge der Schritte ist nicht beliebig -- siehe README.
on:
  workflow_dispatch:
    inputs:
      schritte:
        description: "Welcher Teil der Kette"
        type: choice
        default: nur-pruefen
        options:
          - nur-pruefen
          - 1-atlas
          - 2-embedding
          - 3-koepfe
          - 4-transformer
          - 5-chance
          - alles
      epochen:
        description: "DC_EPOCHEN fuer Embedding, Koepfe, Transformer (leer = Vorgabe jeder App; 2-3 fuer eine Rauchprobe)"
        default: ""
      lernrate:
        description: "DC_LR (leer = Vorgabe der App)"
        default: ""
      stapel:
        description: "DC_STAPEL (leer = Vorgabe der App)"
        default: ""
      cs_epochen:
        description: "CS_EPOCHEN (Chance-Kopf; leer = Vorgabe der App, 1500)"
        default: ""
      vorlauf:
        description: "Run-ID eines frueheren Laufes, dessen aiondb fortgesetzt wird (leer = leer anfangen)"
        default: ""
      aiml_quelle:
        description: "aiml: aus kontor holen, bauen, oder holen-sonst-bauen"
        type: choice
        default: auto
        options: [auto, kontor, bauen]
      kontor:
        description: "Modelle nach kontor hochladen (braucht die Geheimnisse KONTOR_*)"
        type: boolean
        default: true
      koepfe:
        description: "Nur diese Koepfe in Schritt 3, z.B. world-entity-head (leer = alle fuenf)"
        default: ""
      korpus_neu:
        description: "Korpora vorher neu erzeugen (korpusgen alles)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read      # fuer download-artifact aus einem frueheren Lauf

concurrency:
  # Zwei Laeufe auf derselben Datenbank wuerden sich die Gewichte
  # ueberschreiben.  Ein Lauf zur Zeit, und ein neuer bricht keinen alten ab.
  group: training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 350   # GitHub kappt bei 360
    # Ausdruecklich `bash`: nur dann setzt GitHub `-eo pipefail`.  Ohne
    # Angabe laeuft `bash -e`, und in `exodus build ... | tee` zaehlt dann
    # allein der Exitcode von tee -- ein gescheiterter Build ginge durch.
    defaults:
      run:
        shell: bash
    env:
      # aiml hat keinen `main`, nur `master` -- daran starb Lauf #1.
      AIML_REF: master
      SCHRITTE: ${{ inputs.schritte }}

    steps:
      - name: Korpus-Repo
        uses: actions/checkout@v4

      # Seit 25.11.2026 oeffentlich -- kein Token mehr noetig.
      - name: aiml
        uses: actions/checkout@v4
        with:
          repository: Pymann/aiml
          ref: ${{ env.AIML_REF }}
          path: .werkzeug/aiml

      - name: exodus
        uses: actions/checkout@v4
        with:
          repository: Pymann/exodus
          path: .werkzeug/exodus

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Dieselben Systempakete wie die aiml-CI (ohne die Display-Pakete, die
      # nur deren Testkorpus braucht).  patchelf und dpkg-dev braucht
      # `exodus pkg install` fuer die gepinnten .debs.
      - name: Systempakete
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ dpkg-dev patchelf

      # Seit exodus fd39730 (23.11.2026) packt pyproject alle Unterpakete;
      # ein normaler Install reicht.
      - name: exodus einrichten
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./.werkzeug/exodus
          exodus --version

      # kontor wird fuer ZWEIERLEI gebraucht -- den Uebersetzer holen und die
      # Modelle ablegen --, darum steht der Zugang hier und nicht erst am Ende.
      # Fehlt ein Geheimnis, laeuft der Lauf trotzdem: dann wird aiml gebaut.
      - name: kontor-Zugang
        id: kontor
        env:
          KONTOR_URL: ${{ secrets.KONTOR_URL }}
          KONTOR_TOKEN: ${{ secrets.KONTOR_TOKEN }}
          KONTOR_CA: ${{ secrets.KONTOR_CA }}
        run: |
          set -eu
          mkdir -p .werkzeug
          if [ -z "${KONTOR_URL:-}" ] || [ -z "${KONTOR_TOKEN:-}" ] || [ -z "${KONTOR_CA:-}" ]; then
            echo "da=0" >> "$GITHUB_OUTPUT"
            echo "Geheimnisse KONTOR_* fehlen -- aiml wird gebaut."
            exit 0
          fi
          printf '%s\n' "$KONTOR_CA" > .werkzeug/kontor-ca.crt
          # Kein `curl -k`: ohne Zertifikatspruefung koennte ein Mittelsmann
          # das Schreibtoken abfangen.
          echo "kontor: $(curl --silent --show-error --fail-with-body --max-time 60 \
                               --cacert .werkzeug/kontor-ca.crt \
                               -H "Authorization: Bearer $KONTOR_TOKEN" \
                               "$KONTOR_URL/api/v1/whoami")"
          echo "da=1" >> "$GITHUB_OUTPUT"

      - name: Welcher aiml-Stand
        id: stand
        run: |
          sha=$(git -C .werkzeug/aiml rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "AIML_SHA=$sha" >> "$GITHUB_ENV"

      # Der aiml-Uebersetzer bindet LLVM 18 ein; ihn bei jedem Lauf neu zu
      # bauen waere die teuerste Zeile dieses Workflows.  Darum liegt der
      # fertige Uebersetzer in kontor, geschluesselt auf den Commit: einmal
      # bauen je Stand, danach laden (185 MB, 56 MB gepackt).
      #
      # Warum die GENERISCHE Ablage und nicht `/exodus/<name>/<version>/package`:
      # dort muessen Name und Version mit dem Manifest uebereinstimmen, und
      # aiml traegt EINE Version ueber alle Commits -- jeder neue Stand wuerde
      # den alten ueberschreiben.  Hier ist der Commit der Schluessel.
      #
      # Statt des GHA-Caches, nicht dazu: zwei Speicher fuer dieselbe Sache
      # waeren zwei Wahrheiten.  kontor ist der haltbarere -- Caches verfallen
      # nach sieben Tagen ohne Zugriff und gelten nur je Repo.
      - name: aiml aus kontor holen
        id: holen
        if: inputs.aiml_quelle != 'bauen' && steps.kontor.outputs.da == '1'
        env:
          KONTOR_URL: ${{ secrets.KONTOR_URL }}
          KONTOR_TOKEN: ${{ secrets.KONTOR_TOKEN }}
        run: |
          set -eu
          ziel="$KONTOR_URL/generic/aiml/${AIML_SHA}/aiml-x86_64-linux.tar.gz"
          if curl --silent --show-error --fail --max-time 900 \
                  --cacert .werkzeug/kontor-ca.crt \
                  -H "Authorization: Bearer $KONTOR_TOKEN" \
                  -o .werkzeug/aiml-paket.tar.gz "$ziel"; then
            mkdir -p .werkzeug/venv
            tar -xzf .werkzeug/aiml-paket.tar.gz -C .werkzeug/venv
            rm -f .werkzeug/aiml-paket.tar.gz
            # Ein Stand von vor dem Buendeln (bis Lauf #9) laedt seine
            # gepinnten Bibliotheken nicht: dann wie nicht vorhanden behandeln,
            # neu bauen und ueberschreiben.
            fehlt="$(ldd .werkzeug/venv/bin/aiml .werkzeug/venv/lib/libaiml.so | grep 'not found' || true)"
            if [ -x .werkzeug/venv/bin/aiml ] && [ -f .werkzeug/venv/lib/libaiml.so ] && [ -z "$fehlt" ]; then
              echo "da=1" >> "$GITHUB_OUTPUT"
              echo "geladen: $ziel"
            else
              echo "geladen, aber unvollstaendig -- wird neu gebaut:"; echo "$fehlt"
              rm -rf .werkzeug/venv
              echo "da=0" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "da=0" >> "$GITHUB_OUTPUT"
            echo "${AIML_SHA} liegt nicht in kontor -- wird gebaut und danach abgelegt."
          fi

      - name: aiml war Pflicht aus kontor
        if: inputs.aiml_quelle == 'kontor' && steps.holen.outputs.da != '1'
        run: |
          echo "aiml_quelle=kontor verlangt, aber ${AIML_SHA} liegt nicht in kontor."
          echo "Mit aiml_quelle=auto laufen lassen -- das baut und legt ab."
          exit 1

      # Wie die aiml-CI: erst die gepinnten .debs holen (Launchpad als
      # Rueckfall, wenn der Spiegel eine Version verloren hat), dann
      # `exodus pkg install`, dann gezielt Uebersetzer und Laufzeit.  Kein
      # `--all`: das baute jede exodus*.json im aiml-Repo, auch asan und wasm.
      - name: aiml bauen
        if: steps.holen.outputs.da != '1'
        working-directory: .werkzeug/aiml
        run: |
          set -eu
          python3 tools/ci/fetch_pinned_debs.py exodus.json exodus2.json
          exodus pkg install
          exodus build -c exodus.json  -j "$(nproc)"
          exodus build -c exodus2.json -j "$(nproc)"
          ls -l out/aiml/aiml out/libaiml/libaiml.so
          # aiml's eigener Packschritt (CI-Schritt "Package"): legt die
          # gepinnten .so aus __exodus_cache nach lib/, setzt RUNPATH $ORIGIN
          # und prueft das Buendel ausserhalb des Checkouts.
          rm -rf "$GITHUB_WORKSPACE/.werkzeug/dist"
          bash tools/ci/package_release.sh "git-${AIML_SHA::7}" "$GITHUB_WORKSPACE/.werkzeug/dist"

      # exodus loest `$AIML` und `$AIML_VENV` in den Configs auf (aiml spec/68
      # F68-23).  Darum steht in keiner Config dieses Repos ein absoluter Pfad.
      - name: aiml-Venv zusammenstellen
        if: steps.holen.outputs.da != '1'
        run: |
          set -eu
          rm -rf .werkzeug/venv
          mkdir -p .werkzeug/venv
          tar -xzf .werkzeug/dist/aiml-git-*-linux-x86_64.tar.gz -C .werkzeug/venv --strip-components=1
          echo "# aiml venv" > .werkzeug/venv/env
          ls .werkzeug/venv/lib

      # Was gebaut wurde, kommt nach kontor -- damit der naechste Lauf laedt.
      - name: aiml nach kontor legen
        if: steps.holen.outputs.da != '1' && steps.kontor.outputs.da == '1'
        env:
          KONTOR_URL: ${{ secrets.KONTOR_URL }}
          KONTOR_TOKEN: ${{ secrets.KONTOR_TOKEN }}
        run: |
          set -eu
          tar -czf .werkzeug/aiml-paket.tar.gz -C .werkzeug/venv bin lib env
          summe=$(sha256sum .werkzeug/aiml-paket.tar.gz | cut -d' ' -f1)
          curl --silent --show-error --fail-with-body --max-time 1800 \
               --cacert .werkzeug/kontor-ca.crt \
               -H "Authorization: Bearer $KONTOR_TOKEN" \
               -H "X-Checksum-Sha256: $summe" \
               -X PUT -T .werkzeug/aiml-paket.tar.gz \
               "$KONTOR_URL/generic/aiml/${AIML_SHA}/aiml-x86_64-linux.tar.gz"
          echo "abgelegt: generic/aiml/${AIML_SHA}/ ($(stat -c%s .werkzeug/aiml-paket.tar.gz) B)"
          rm -f .werkzeug/aiml-paket.tar.gz

      # Beide Wege -- geladen und gebaut -- brauchen dieselben Pfade.
      - name: Pfade setzen
        run: |
          set -eu
          echo "AIML=$PWD/.werkzeug/venv/bin/aiml" >> "$GITHUB_ENV"
          echo "AIML_VENV=$PWD/.werkzeug/venv" >> "$GITHUB_ENV"
          echo "AIONDB_PATH=$PWD/aiondb" >> "$GITHUB_ENV"
          test -x .werkzeug/venv/bin/aiml
          test -f .werkzeug/venv/lib/libaiml.so

      - name: Stand des Vorlaufs holen
        if: inputs.vorlauf != ''
        uses: actions/download-artifact@v4
        with:
          name: aiondb
          run-id: ${{ inputs.vorlauf }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: aiondb

      # DC_EPOCHEN/CS_EPOCHEN nur, wenn eine Zahl eingetragen ist.  Bis zum
      # 25.11.2026 stand hier fest `DC_EPOCHEN: 15` fuer ALLE Apps -- die
      # Koepfe haben aber eigene Vorgaben (Item 1200, Skill 200, Kampfskill
      # 150, World-Entity 60, Kampfwert 150).  Der Item-Kopf bekam damit 1,25 %
      # seiner Epochen und lag in der Abnahme auf Zufallsniveau (Lauf #5:
      # 2 von 526 richtig).
      - name: Epochen
        env:
          IN_EPOCHEN: ${{ inputs.epochen }}
          IN_CS_EPOCHEN: ${{ inputs.cs_epochen }}
        run: |
          if [ -n "$IN_EPOCHEN" ]; then echo "DC_EPOCHEN=$IN_EPOCHEN" >> "$GITHUB_ENV"; fi
          if [ -n "$IN_CS_EPOCHEN" ]; then echo "CS_EPOCHEN=$IN_CS_EPOCHEN" >> "$GITHUB_ENV"; fi
          echo "DC_EPOCHEN=${IN_EPOCHEN:-<Vorgabe>}  CS_EPOCHEN=${IN_CS_EPOCHEN:-<Vorgabe>}"

      - name: Datenbankordner
        run: mkdir -p aiondb berichte

      # ── Korpora ──────────────────────────────────────────────────────────
      - name: Korpora neu erzeugen
        if: inputs.korpus_neu
        run: |
          set -eu
          "$AIML" korpusgen/korpusgen.aiml -r -- alles 42 2>&1 | tee berichte/korpusgen.log

      - name: Datenregeln (Stoffe, Cluster, Regellisten)
        run: |
          set -eu
          exodus build -c exodus-rezept-probe.json 2>&1 | tee berichte/build_probe.log
          ./rezept_probe 2>&1 | tee berichte/rezept_probe.log

      # ── Die Kette ────────────────────────────────────────────────────────
      - name: 1 Atlas und Wortschatz
        if: contains(fromJSON('["1-atlas","alles"]'), inputs.schritte)
        run: |
          set -eu
          exodus build -c exodus-prophecy.json 2>&1 | tee berichte/build_atlas.log
          ./prophecy_build 2>&1 | tee berichte/1_atlas.log

      - name: 2 Embedding
        if: contains(fromJSON('["2-embedding","alles"]'), inputs.schritte)
        run: |
          set -eu
          exodus build -c exodus-prophecy-pretrain.json 2>&1 | tee berichte/build_pretrain.log
          ./prophecy_pretrain 2>&1 | tee berichte/2_embedding.log

      - name: 3 Koepfe
        if: contains(fromJSON('["3-koepfe","alles"]'), inputs.schritte)
        env:
          # Nicht direkt als DC_LR/DC_STAPEL: ein leeres Eingabefeld setzt die
          # Variable dann auf "", die App sieht sie als vorhanden und parst
          # "" -- in Lauf #4 trainierte der Item-Kopf darum mit `lr=0`.
          IN_LR: ${{ inputs.lernrate }}
          IN_STAPEL: ${{ inputs.stapel }}
          # Ein einzelner Kopf laesst sich so nachtrainieren, ohne die anderen
          # vier noch einmal laufen zu lassen.  Mit den Epochen-Vorgaben der
          # Apps passen alle fuenf vermutlich nicht in einen Job (README).
          IN_KOEPFE: ${{ inputs.koepfe }}
        run: |
          set -eu
          if [ -n "$IN_LR" ]; then export DC_LR="$IN_LR"; fi
          if [ -n "$IN_STAPEL" ]; then export DC_STAPEL="$IN_STAPEL"; fi
          koepfe="${IN_KOEPFE:-item-head skill-head combat-skill-head world-entity-head combat-score-head}"
          for teil in $koepfe; do
            [ -f "exodus-prophecy-$teil.json" ] || { echo "unbekannter Kopf: $teil"; exit 1; }
            echo "== $teil =="
            exodus build -c "exodus-prophecy-$teil.json" 2>&1 | tee "berichte/build_$teil.log"
            bin="prophecy_train_${teil%-head}_head"
            bin="${bin//-/_}"
            "./$bin" 2>&1 | tee "berichte/3_$bin.log"
          done

      - name: 4 Transformer
        if: contains(fromJSON('["4-transformer","alles"]'), inputs.schritte)
        env:
          # Nicht direkt als DC_LR/DC_STAPEL: ein leeres Eingabefeld setzt die
          # Variable dann auf "", die App sieht sie als vorhanden und parst
          # "" statt ihre Vorgabe zu nehmen (siehe Schritt 3).
          IN_LR: ${{ inputs.lernrate }}
          IN_STAPEL: ${{ inputs.stapel }}
        run: |
          set -eu
          if [ -n "$IN_LR" ]; then export DC_LR="$IN_LR"; fi
          if [ -n "$IN_STAPEL" ]; then export DC_STAPEL="$IN_STAPEL"; fi
          exodus build -c exodus-prophecy-train-transformer.json 2>&1 | tee berichte/build_transformer.log
          ./prophecy_train_transformer 2>&1 | tee berichte/4_transformer.log

      - name: 5 Chance-Kopf
        if: contains(fromJSON('["5-chance","alles"]'), inputs.schritte)
        run: |
          set -eu
          exodus build -c exodus-prophecy-chance-kopf.json 2>&1 | tee berichte/build_chance.log
          ./prophecy_train_chance_kopf 2>&1 | tee berichte/5_chance.log

      # ── Abnahme ──────────────────────────────────────────────────────────
      # Das Korpus-Gate zaehlt, wieviele Korpuswoerter keinen Atlas-Schluessel
      # haben.  Vor Schritt 1 sind es 9 (Prozessmarken wie `rune_craft`);
      # danach soll es 0 sein.  Darum laeuft es NACH der Kette.
      - name: Korpus-Gate
        id: gate
        if: always()
        continue-on-error: true
        run: |
          set -eu
          exodus build -c exodus-prophecy-gate-korpus.json 2>&1 | tee berichte/build_gate.log
          ./prophecy_gate_korpus 2>&1 | tee berichte/gate_korpus.log

      # ── Nach kontor ──────────────────────────────────────────────────────
      # Ein Lauf, der nur geprueft hat, hat keine Gewichte erzeugt -- der
      # laedt auch nichts hoch.
      - name: Modelle nach kontor
        if: ${{ inputs.kontor && inputs.schritte != 'nur-pruefen' }}
        env:
          KONTOR_URL: ${{ secrets.KONTOR_URL }}
          KONTOR_TOKEN: ${{ secrets.KONTOR_TOKEN }}
          KONTOR_CA: ${{ secrets.KONTOR_CA }}
          GATE_ERGEBNIS: ${{ steps.gate.outcome }}
        run: |
          set -eu
          for name in KONTOR_URL KONTOR_TOKEN KONTOR_CA; do
            eval "wert=\${$name:-}"
            [ -n "$wert" ] || { echo "Geheimnis $name fehlt -- siehe README."; exit 1; }
          done
          # Die CA liegt schon vom Schritt `kontor-Zugang` her da.
          test -f .werkzeug/kontor-ca.crt || printf '%s\n' "$KONTOR_CA" > .werkzeug/kontor-ca.crt
          # Als Funktion, nicht als Variable: ein mehrzeiliger Befehl in einer
          # Variablen wird bei der Wortzerlegung zur Gluecksache, und das
          # Token darf nicht durch eine Zerlegung rutschen.
          hoch() {
            curl --silent --show-error --fail-with-body --max-time 900 \
                 --cacert .werkzeug/kontor-ca.crt \
                 -H "Authorization: Bearer $KONTOR_TOKEN" "$@"
          }

          stores=$(cd aiondb && ls prophecy_*.kvwal 2>/dev/null || true)
          [ -n "$stores" ] || { echo "keine prophecy-Stores in aiondb -- nichts hochzuladen."; exit 1; }

          # --sparse, weil ein kvwal zu 16 MB ueberwiegend aus Nullen besteht.
          tar --sparse -C aiondb -czf modelle.tar.gz $stores
          summe=$(sha256sum modelle.tar.gz | cut -d' ' -f1)
          groesse=$(stat -c%s modelle.tar.gz)

          # Herkunft neben das Paket, damit man sie ohne Download lesen kann.
          # `grep -c` gibt bei null Treffern "0" aus UND Exitcode 1 -- ein
          # `|| echo 0` dahinter haengt eine zweite Null an.  Gemessen.
          gate_zeile=0
          if [ -f berichte/gate_korpus.log ]; then
            gate_zeile=$(grep -c 'ohne Token' berichte/gate_korpus.log || true)
            [ -n "$gate_zeile" ] || gate_zeile=0
          fi
          python3 - "$summe" "$groesse" "$gate_zeile" <<'EOP' > modelle.json
          import json, os, sys
          summe, groesse, gate = sys.argv[1], int(sys.argv[2]), int(sys.argv[3])
          print(json.dumps({
            "erzeugt_von": "dc_traincorp/.github/workflows/training.yml",
            "lauf": os.environ.get("GITHUB_RUN_ID"),
            "laufnummer": os.environ.get("GITHUB_RUN_NUMBER"),
            "korpus_commit": os.environ.get("GITHUB_SHA"),
            "aiml_commit": os.environ.get("AIML_SHA"),
            "schritte": os.environ.get("SCHRITTE"),
            "epochen": os.environ.get("DC_EPOCHEN", "Vorgabe"),
            "cs_epochen": os.environ.get("CS_EPOCHEN", "Vorgabe"),
            "stores": sorted(f for f in os.listdir("aiondb") if f.startswith("prophecy_")),
            "paket_sha256": summe,
            "paket_bytes": groesse,
            "gate_woerter_ohne_token": gate,
          }, indent=1, ensure_ascii=False))
          EOP

          ziel="generic/datacreatures/prophecy/${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}"
          echo "== $ziel =="
          hoch -X PUT -T modelle.tar.gz -H "X-Checksum-Sha256: $summe" "$KONTOR_URL/$ziel/modelle.tar.gz"
          hoch -X PUT -T modelle.json "$KONTOR_URL/$ziel/modelle.json"

          # `neueste` nur, wenn das Gate kein Wort ohne Token gefunden hat.
          # Kaputte Gewichte als "neueste" zu veroeffentlichen waere schlimmer
          # als sie gar nicht zu veroeffentlichen.
          # Und nur, wenn das Gate selbst gruen war: ein Gate, das abstuerzt
          # oder Trainingsfolgen ablehnt, schreibt kein "ohne Token" -- die
          # Zeilenzaehlung allein liesse es durch.
          if [ "$gate_zeile" = "0" ] && [ "$GATE_ERGEBNIS" = "success" ]; then
            hoch -X PUT -T modelle.tar.gz -H "X-Checksum-Sha256: $summe" \
                  "$KONTOR_URL/generic/datacreatures/prophecy/neueste/modelle.tar.gz"
            hoch -X PUT -T modelle.json "$KONTOR_URL/generic/datacreatures/prophecy/neueste/modelle.json"
            echo "auch als neueste veroeffentlicht"
          else
            echo "NICHT als neueste: Gate ${GATE_ERGEBNIS}, Zeilen ohne Token: ${gate_zeile}"
          fi

      - name: Ergebnis sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiondb
          path: aiondb
          retention-days: 30
          if-no-files-found: warn

      - name: Berichte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: berichte
          path: berichte
          retention-days: 30
          if-no-files-found: warn
