name: Checks

# Cheap checks that need neither aiml nor training: they run on every push
# and pull request.  The training itself stays manual (training.yml).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package-complete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck tools/package_complete.sh tools/test_package_complete.sh
      - name: package completeness check
        run: tools/test_package_complete.sh
