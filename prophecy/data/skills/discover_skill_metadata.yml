# Metadaten der ENTDECKBAREN Skills (aktiv, passiv, mechanisch).
# Erzeugt von scripts/build_discover_skill_metadata.py — danach von Hand
# nachgepflegt, genau wie combat_skill_metadata.yml.
#
# Konsumenten:
#   1. scripts/generate_clustered_corpus.py --only-skills → data/skill_corpus.txt
#   2. Server: Tor (foundation) + Art beim Entdecken (sources/server/discovery.aiml)
#
# Felder:
#   foundation          Starter-Skill, der die Rubrik aufschliesst.  Ohne ihn
#                       kann die Kreatur den Skill nicht entdecken.
#   base_actions        Taetigkeiten, die dorthin fuehren.
#   item_name_required  Gegenstaende/Rohstoffe, die dabei typisch sind.
#   skill_tags          Tags, die dabei typisch sind.
#   element_tags        passendes Element (kann leer sein).
#   ROUTENSCHLUESSEL    Einige dieser Kennungen stehen in einem Realm als
#                       `required_skill_ids` einer Route (assets/realms/*.json)
#                       und sperren sie, solange die Kreatur den Skill nicht
#                       entdeckt hat: `shard-walker` (Glass Mouth <-> Shatter
#                       Rim) und `qbit-attune` (Glass Mouth <-> Qbit Nursery,
#                       Qbit Nursery <-> Coherence Farm).  Wer eine solche
#                       Kennung umbenennt, sperrt die Route dauerhaft -- der
#                       Server vergleicht sie nur noch gegen etwas, das es
#                       nicht mehr gibt.  Beide tragen darum `travel_assist`.
#   wirkungen           NUR bei `kind: passive`: was die Fertigkeit dauernd
#                       bewirkt, als Kanal=Zahl.  Lesart und Deckel stehen in
#                       doc/architecture/passive_skills_wirkungen_2026-11-12.md.
#                       Keine Lernmerkmale -- der Korpus-Erzeuger uebergeht
#                       sie.  Die Zahl steht mit "=", nicht mit ":", weil der
#                       schlanke Leser im Server die Zeile an ":" teilt.
#                       Zugeteilt ist bisher EIN Kanal je Rubrik; Feinarbeit
#                       je Fertigkeit kann folgen.  Von den Kanaelen wirken
#                       heute `action.duration`, `travel.duration`,
#                       `find.chance` und `harvest.yield` -- `attr.*` und
#                       `neutralize.*` werden gespeichert und angezeigt, aber
#                       von noch niemandem gefragt.
#   quelle              woher das Geruest die Merkmale hat: `name` aus den
#                       Woertern des Skillnamens, `verteilt` reihum aus dem
#                       Topf der Rubrik.  Nachpflege faengt bei `verteilt` an.
